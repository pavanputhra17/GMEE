# Production-like deployment. Load the required root runtime file explicitly:
# docker compose --env-file .env -f infra/docker-compose.yml up -d --build
# Datastores and the API have no host ports; publish the SPA behind a TLS gateway.
x-backend-environment: &backend-environment
  ENVIRONMENT: production
  POSTGRES_URL: postgresql+asyncpg://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB}
  REDIS_URL: redis://redis:6379/0
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD}
  JWT_SECRET: ${JWT_SECRET:?Set a unique JWT_SECRET of at least 32 characters}
  CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:3000"]}'
  ENABLE_SCHEDULER: ${ENABLE_SCHEDULER:-false}
  # Only this nginx peer can rewrite Uvicorn's socket client address.
  FORWARDED_ALLOW_IPS: 172.30.47.10

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: gmee_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12

  neo4j:
    image: neo4j:5.20
    container_name: gmee_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD}
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512M
    volumes:
      - neo4j-data:/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: gmee_redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks: [data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: production
    container_name: gmee_backend
    restart: unless-stopped
    expose: ["8000"]
    env_file:
      - path: ../.env
        required: true
    environment: *backend-environment
    # Deliberately no source bind mount. Models are loaded lazily by the app.
    volumes:
      - model-cache:/home/gmee/.cache
    networks:
      data:
      proxy:
        ipv4_address: 172.30.47.20
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=8).close()"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 60s

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: production
    container_name: gmee_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    networks:
      proxy:
        ipv4_address: 172.30.47.10
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 3s
      retries: 4
    security_opt: ["no-new-privileges:true"]

networks:
  data:
    internal: true
  proxy:
    ipam:
      config:
        - subnet: 172.30.47.0/24

volumes:
  postgres-data:
  neo4j-data:
  redis-data:
  model-cache:

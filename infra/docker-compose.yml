
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: gmee_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gmee
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gmee"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.20
    container_name: gmee_neo4j
    restart: always
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_dbms_memory_heap_max__size: 1G
      NEO4J_dbms_memory_pagecache_size: 512M
      NEO4J_server_memory_pagecache_size: 512M
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: gmee_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: gmee_backend
    # unless-stopped (not always): a manual `docker stop` must stay stopped, so
    # the container does not squat :8000 on [::] and shadow the local dev server.
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      # .env is written for HOST-local dev (localhost:55432 etc.) and is
      # unreachable from inside a container — without these overrides the
      # backend crash-loops on asyncpg and its dead port-proxy squats :8000
      # with empty replies. `environment` beats `env_file`, so the in-network
      # service names/ports win here while local dev keeps using .env.
      POSTGRES_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/gmee
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/gmee
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
    volumes:
      - ../backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: gmee_frontend
    # Unless-stopped for the same reason as the backend above.
    restart: unless-stopped
    ports:
      # nginx serves the built SPA on :80 in the container; host :3000 keeps
      # the previous public URL. API calls are same-origin (/api/v1) and
      # proxied by nginx to the backend service — no CORS involved.
      - "3000:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres-data:
  neo4j-data:
  redis-data:

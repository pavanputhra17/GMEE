# Disposable HTTP smoke fixture. NEVER combine with docker-compose.yml.
# No root .env, host ports, container_name, source mount or persistent DB volumes.
# Use a fresh --project-name; all database state is discarded with the containers.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: fixture
      POSTGRES_PASSWORD: fixture-only-postgres
      POSTGRES_DB: gmee_smoke_fixture
    tmpfs:
      - /var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "fixture", "-d", "gmee_smoke_fixture"]
      interval: 3s
      timeout: 3s
      retries: 20

  neo4j:
    image: neo4j:5.20
    environment:
      NEO4J_AUTH: neo4j/fixture-only-neo4j
      NEO4J_server_memory_heap_initial__size: 256M
      NEO4J_server_memory_heap_max__size: 512M
      NEO4J_server_memory_pagecache_size: 256M
    tmpfs:
      - /data
      - /logs
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    tmpfs: [/data]
    networks: [data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ../backend
      target: production
    environment:
      ENVIRONMENT: testing
      POSTGRES_URL: postgresql+asyncpg://fixture:fixture-only-postgres@postgres:5432/gmee_smoke_fixture
      DATABASE_URL: postgresql+asyncpg://fixture:fixture-only-postgres@postgres:5432/gmee_smoke_fixture
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: fixture-only-neo4j
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: fixture-smoke-secret-not-for-deployment-0001
      CORS_ORIGINS: '["http://frontend"]'
      ENABLE_SCHEDULER: "false"
      RATE_LIMIT_ENABLED: "true"
      FORWARDED_ALLOW_IPS: 172.30.48.10
    networks:
      data:
      proxy:
        ipv4_address: 172.30.48.20
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=8).close()"]
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 30s

  frontend:
    build:
      context: ../frontend
      target: production
    networks:
      proxy:
        ipv4_address: 172.30.48.10
    depends_on:
      backend:
        condition: service_healthy

  smoke:
    image: python:3.11-slim
    environment:
      GMEE_SMOKE_FIXTURE: "1"
    volumes:
      - ./scripts:/smoke:ro
    working_dir: /smoke
    command: ["python", "http_smoke.py", "--base-url", "http://frontend", "--fixture-only", "--deadline-seconds", "240", "--request-timeout", "8"]
    networks: [proxy]
    depends_on:
      frontend:
        condition: service_started

networks:
  data:
    internal: true
  proxy:
    ipam:
      config:
        - subnet: 172.30.48.0/24

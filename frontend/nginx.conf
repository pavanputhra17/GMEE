# Serves the built SPA and proxies the API same-origin to the `backend`
# service in infra/docker-compose.yml. Routing is hash-based (#/dashboard),
# so every path can safely fall back to index.html.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # Docker's embedded DNS + a variable proxy_pass defers resolution to
        # request time, so this container starts even when the backend
        # service is absent (e.g. standalone `docker run`); on the compose
        # network `backend` resolves normally. The URI is forwarded as-is.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

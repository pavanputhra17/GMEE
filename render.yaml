# ──────────────────────────────────────────────────────────────
# Render Blueprint — GMEE (Global Misinformation Evolution Engine)
# Docs: https://docs.render.com/infrastructure-as-code
# ──────────────────────────────────────────────────────────────

services:
  # ──────── Backend (FastAPI + Uvicorn) ────────
  - type: web
    name: gmee-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    rootDir: backend
    region: oregon
    plan: free
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: ENABLE_SCHEDULER
        value: "false"
      - key: CORS_ORIGINS
        value: '["https://gmee-v1.onrender.com"]'
      - key: RATE_LIMIT_ENABLED
        value: "true"
      # ── Secrets (set these in the Render Dashboard) ──
      - key: JWT_SECRET
        generateValue: true
      - key: POSTGRES_URL
        sync: false          # set manually in Dashboard
      - key: DATABASE_URL
        sync: false
      - key: NEO4J_URI
        value: ""             # optional — leave empty to skip
      - key: NEO4J_USER
        value: ""
      - key: NEO4J_PASSWORD
        value: ""
      - key: REDIS_URL
        value: ""             # optional — leave empty to skip
      - key: ANTHROPIC_API_KEY
        sync: false
    healthCheckPath: /api/v1/health

  # ──────── Frontend (Vite Static Site) ────────
  - type: web
    name: gmee-v1
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    region: oregon
    envVars:
      - key: VITE_API_BASE_URL
        value: https://gmee-backend.onrender.com/api/v1
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      # SPA fallback — all paths serve index.html
      - type: rewrite
        source: /*
        destination: /index.html


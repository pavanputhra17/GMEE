# ──────────────────────────────────────────────────────────────
# Render Blueprint — GMEE (Global Misinformation Evolution Engine)
# Docs: https://docs.render.com/infrastructure-as-code
# ──────────────────────────────────────────────────────────────

services:
  # ──────── Backend (FastAPI + Uvicorn) ────────
  - type: web
    name: gmee-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: oregon
    plan: free
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: ENABLE_SCHEDULER
        value: "true"
      - key: CORS_ORIGINS
        value: '["https://gmee-frontend.onrender.com"]'
      # ── Secrets (set these in the Render Dashboard) ──
      - key: JWT_SECRET
        generateValue: true
      - key: POSTGRES_URL
        sync: false          # set manually in Dashboard
      - key: DATABASE_URL
        sync: false
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
    healthCheckPath: /api/v1/health/ready

  # ──────── Frontend (Vite Static Site) ────────
  - type: web
    name: gmee-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    region: oregon
    envVars:
      - key: VITE_API_BASE_URL
        value: https://gmee-backend.onrender.com/api/v1
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      # SPA fallback — all paths serve index.html
      - type: rewrite
        source: /*
        destination: /index.html

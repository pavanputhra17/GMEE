name: Deployment contracts

on:
  push:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'infra/**'
      - 'render.yaml'
      - '.github/workflows/**'
      - 'docs/*.md'
      - 'README.md'
      - 'ARCHITECTURE.md'
      - 'CHANGELOG.md'
      - 'verify_endpoints.ps1'
      - '_ui_sweep.ps1'
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'infra/**'
      - 'render.yaml'
      - '.github/workflows/**'
      - 'docs/*.md'
      - 'README.md'
      - 'ARCHITECTURE.md'
      - 'CHANGELOG.md'
      - 'verify_endpoints.ps1'
      - '_ui_sweep.ps1'

permissions:
  contents: read

concurrency:
  group: deployment-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install configuration checker only
        run: python -m pip install 'PyYAML==6.0.2' 'ruff==0.16.2'
      - name: Static deployment contracts (no runtime secrets or containers)
        run: python infra/scripts/validate_deployment.py
      - name: Lint infrastructure and backup scripts
        run: ruff check --config backend/pyproject.toml backend/scripts/backup_database.py infra/scripts/*.py infra/tests/*.py
      - name: Offline infrastructure safety tests
        run: python -m unittest discover -s infra/tests -v

  powershell-contracts:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Parse read-only verification scripts (no API requests)
        shell: powershell
        run: powershell.exe -NoProfile -File infra/scripts/validate_powershell.ps1

  http-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Build production images for a disposable fixture
        timeout-minutes: 25
        run: docker compose --project-name gmee-ci-smoke --env-file infra/fixture.env -f infra/docker-compose.smoke.yml build
      - name: Check nginx syntax in the built image
        timeout-minutes: 2
        run: docker compose --project-name gmee-ci-smoke --env-file infra/fixture.env -f infra/docker-compose.smoke.yml run --rm --no-deps frontend nginx -t
      - name: HTTP end-to-end smoke (not browser E2E)
        timeout-minutes: 7
        run: docker compose --project-name gmee-ci-smoke --env-file infra/fixture.env -f infra/docker-compose.smoke.yml up --abort-on-container-exit --exit-code-from smoke --timeout 15
      - name: Remove only the CI fixture
        if: always()
        timeout-minutes: 2
        run: docker compose --project-name gmee-ci-smoke --env-file infra/fixture.env -f infra/docker-compose.smoke.yml down --volumes --remove-orphans --timeout 15

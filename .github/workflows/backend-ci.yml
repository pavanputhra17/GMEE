name: Backend CI

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      POSTGRES_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/gmee
      NEO4J_URI: neo4j://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      REDIS_URL: redis://localhost:6379/0
      CORS_ORIGINS: '["http://localhost:3000"]'
      JWT_SECRET: ci-only-secret-key-that-is-at-least-32-chars-long
    services:
      # Real pgvector for the integration tests: the main suite runs on SQLite,
      # which never exercises `<=>`, the HNSW index or the unique edge
      # constraint. Same image as infra/docker-compose.yml.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gmee
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gmee"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Lint with Ruff
        run: ruff check .

      - name: Type check with mypy
        run: mypy .

      - name: Test with pytest
        run: pytest --cov=app --cov-report=term --cov-fail-under=70 -m "not integration"

      - name: Migrate the integration database
        run: alembic upgrade head

      - name: Integration tests (real Postgres + pgvector)
        run: pytest tests/integration -m integration -v

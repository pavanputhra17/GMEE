name: Frontend CI

on:
  push:
    paths:
      - 'frontend/**'
      - 'infra/**'
      - 'render.yaml'
      - '.github/workflows/frontend-ci.yml'
      - '.github/workflows/deployment-ci.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'infra/**'
      - 'render.yaml'
      - '.github/workflows/frontend-ci.yml'
      - '.github/workflows/deployment-ci.yml'

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
        
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
          
      - name: Install dependencies
        run: npm ci
        
      - name: Lint with ESLint
        run: npm run lint
        
      - name: Type check
        run: npx tsc --noEmit
        
      - name: Build
        run: npm run build
        
      - name: Test with coverage
        run: npx vitest run --coverage --coverage.thresholds.lines=60 --coverage.thresholds.functions=60 --coverage.thresholds.branches=50 --coverage.thresholds.statements=60
